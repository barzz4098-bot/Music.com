<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angga</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0b1a;--pan:#1a1530;--pan2:#241d40;--tx:#f4f2fb;--mut:#a59fc0;--pk:#f2557f;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 500px at 15% -5%,#2a1f52,transparent),var(--bg);color:var(--tx);font:500 15px/1.4 "Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:1280px;margin:auto;padding:0 28px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;padding:44px 0 28px}
h1{font-weight:800;font-size:clamp(64px,13vw,120px);line-height:.95;letter-spacing:-.05em;background:linear-gradient(180deg,#fff,#b9b4cf);-webkit-background-clip:text;background-clip:text;color:transparent}
.cnt{font:500 12px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.cnt b{color:#fff}
.main{display:grid;grid-template-columns:340px 1fr;gap:28px;align-items:start}
.player{position:sticky;top:20px;background:linear-gradient(180deg,var(--pan2),var(--pan));border-radius:28px;padding:22px}
.player .cv{aspect-ratio:1;border-radius:20px;overflow:hidden;box-shadow:0 20px 50px #0008}
.player h2{font-size:24px;font-weight:800;margin-top:18px;letter-spacing:-.02em}
.player .ar{color:var(--mut)}
.bar{height:5px;background:#ffffff22;border-radius:9px;margin:18px 0 6px;cursor:pointer;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pk)}
.tm{display:flex;justify-content:space-between;font:500 11px "JetBrains Mono",monospace;color:var(--mut)}
.ctl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px}
.ctl button{background:#ffffff14;border:0;color:#fff;width:46px;height:46px;border-radius:50%;font-size:16px;cursor:pointer}
.ctl .pp{width:64px;height:64px;background:var(--pk);font-size:22px}
.full{display:block;text-align:center;margin-top:16px;color:var(--mut);font-size:13px;text-decoration:none}
.full:hover{color:#fff}
.tools{display:flex;gap:12px}
#q{flex:1;background:var(--pan);border:1px solid #ffffff12;color:#fff;border-radius:16px;padding:16px 20px;font:inherit;outline:none}
#q:focus{border-color:var(--pk)}
select{background:var(--pan);border:1px solid #ffffff12;color:#fff;border-radius:16px;padding:0 16px;font:inherit}
.chips{display:flex;gap:6px;margin:16px 0 22px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;background:none;border:0;color:var(--mut);font:inherit;padding:11px 20px;border-radius:99px;cursor:pointer;white-space:nowrap}
.chip small{font:500 10px "JetBrains Mono",monospace;opacity:.6;margin-left:5px}
.chip.on{background:#fff;color:#14102a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
.card{cursor:pointer;position:relative}
.card .cv{aspect-ratio:1;border-radius:18px;overflow:hidden;position:relative;transition:.25s}
.card:hover .cv{transform:translateY(-4px);box-shadow:0 14px 30px #0009}
.card.now .cv{outline:3px solid var(--pk)}
.cv img,.ph{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--h) 60% 38%),hsl(calc(var(--h) + 50) 55% 18%))}
.ph span{font-size:56px;font-weight:800;opacity:.55}
.no{position:absolute;left:8px;top:8px;background:#0009;backdrop-filter:blur(6px);font:500 11px "JetBrains Mono",monospace;padding:3px 9px;border-radius:99px}
.hb{position:absolute;right:8px;top:8px;width:34px;height:34px;border:0;border-radius:50%;background:#0009;backdrop-filter:blur(6px);color:#fff;cursor:pointer;font-size:15px}
.hb.on{color:var(--pk)}
.card h3{font-size:15px;font-weight:800;margin-top:10px;letter-spacing:-.01em;overflow-wrap:anywhere}
.card p{color:var(--mut);font-size:13px}
.card em{font:500 11px "JetBrains Mono",monospace;font-style:normal;color:#7d77a0}
.more{display:block;margin:28px auto 0;background:none;border:1px solid #ffffff33;color:#fff;padding:12px 30px;border-radius:99px;font:inherit;cursor:pointer}
@media(max-width:900px){.main{grid-template-columns:1fr}.player{position:static;display:grid;grid-template-columns:110px 1fr;gap:4px 16px}.player .cv{grid-row:span 4}.player h2{margin-top:0}header{padding-top:28px}.wrap{padding:0 16px 50px}}
</style>
</head>

<header><h1>Angga</h1><div class="cnt"><b id="shown">0</b> / <span id="tot">0</span> lagu · <b id="nf">0</b> favorit</div></header>

const $=s=>document.querySelector(s),enc=encodeURIComponent,sleep=ms=>new Promise(r=>setTimeout(r,ms));
let items=[],fav=new Set(),cache={};
try{fav=new Set(JSON.parse(localStorage.getItem('angga-fav')||'[]'));cache=JSON.parse(localStorage.getItem('angga-cache')||'{}')}catch(e){}
V.split('\n').forEach(l=>{const[a,t]=l.split('|');t.split(';').forEach(x=>items.push({t:x,a,g:'viral',sub:'Viral'}))});
A.split('\n').forEach(l=>{const[t,a,s]=l.split('|');items.push({t,a,g:'anime',sub:s})});
items.forEach((x,i)=>{x.id=i;x.n=i+1;x.q=x.t+' '+x.a;x.t=x.t.replace(/'/g,'’');x.a=x.a.replace(/'/g,'’')});
const save=()=>{try{localStorage.setItem('angga-cache',JSON.stringify(cache))}catch(e){}};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const cover=x=>{const m=cache[x.id];return m&&m.img?`<img src="${m.img}" alt="">`:`<div class="ph" style="--h:${hue(x.t)}"><span>${x.t[0]}</span></div>`};
const yt=x=>'https://www.youtube.com/results?search_query='+enc(x.q+' official');
/* ambil cover + audio dari iTunes (pelan-pelan agar tidak kena limit) */
const queue=[];let busy=false;
function want(x,front){if(cache[x.id]||x.p)return;x.p=1;front?queue.unshift(x):queue.push(x);pump()}
async function pump(){if(busy)return;busy=true;
 while(queue.length){const x=queue.shift();
  try{const r=await fetch('https://itunes.apple.com/search?media=music&entity=song&limit=1&term='+enc(x.q));const j=await r.json();const s=j.results&&j.results[0];
   cache[x.id]=s?{img:s.artworkUrl100.replace('100x100','600x600'),pv:s.previewUrl}:{};save();paint(x);
  }catch(e){x.p=0;await sleep(5000)}
  await sleep(1300)}
 busy=false}
function paint(x){document.querySelectorAll('[data-c="'+x.id+'"]').forEach(e=>e.innerHTML=cover(x));if(cur===x)$('#pcv').innerHTML=cover(x)}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){want(items[+e.target.dataset.id]);io.unobserve(e.target)}}),{rootMargin:'200px'});
/* daftar */
let f='all',q='',lim=48,srt=0,view=[],cur=null;
function chips(){const c=k=>k==='all'?items.length:k==='fav'?fav.size:items.filter(x=>x.g===k).length;
 $('#chips').innerHTML=[['all','Semua'],['viral','Viral'],['anime','Anime'],['fav','Favorit']].map(([k,n])=>`<button class="chip ${f===k?'on':''}" data-f="${k}">${n}<small>${c(k)}</small></button>`).join('');
 $('#tot').textContent=items.length;$('#nf').textContent=fav.size}
function render(){
 view=items.filter(x=>(f==='all'||(f==='fav'?fav.has(x.id):x.g===f))&&(x.t+' '+x.a).toLowerCase().includes(q));
 if(srt==1)view.sort((a,b)=>a.t.localeCompare(b.t));if(srt==2)view.sort((a,b)=>a.a.localeCompare(b.a));
 $('#grid').innerHTML=view.slice(0,lim).map(x=>`<div class="card ${cur===x?'now':''}" data-id="${x.id}"><div class="cv"><div data-c="${x.id}" style="height:100%">${cover(x)}</div><span class="no">${String(x.n).padStart(3,'0')}</span><button class="hb ${fav.has(x.id)?'on':''}" data-h="${x.id}">${fav.has(x.id)?'♥':'♡'}</button></div><h3>${x.t}</h3><p>${x.a}</p><em>${x.sub}</em></div>`).join('');
 document.querySelectorAll('.card').forEach(c=>io.observe(c));
 $('#shown').textContent=view.length;$('#more').style.display=view.length>lim?'block':'none';chips()}
/* pemutar */
const au=new Audio();au.preload='none';
const mm=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
async function play(x){cur=x;$('#pt').textContent=x.t;$('#pa').textContent=x.a;$('#pcv').innerHTML=cover(x);$('#full').href=yt(x);
 document.querySelectorAll('.card').forEach(c=>c.classList.toggle('now',+c.dataset.id===x.id));
 $('#pp').textContent='…';
 if(!cache[x.id]){want(x,true);for(let i=0;i<40&&!cache[x.id]&&x.p;i++)await sleep(250)}
 if(cur!==x)return;
 const m=cache[x.id];
 if(m&&m.pv){au.src=m.pv;try{await au.play()}catch(e){}}else{$('#pp').textContent='▶';$('#pa').textContent=x.a+' · preview tidak tersedia, pakai tombol YouTube'}}
const step=d=>{if(!view.length)return;const i=view.indexOf(cur);play(view[(i+d+view.length)%view.length])};
au.onplay=()=>$('#pp').textContent='❚❚';au.onpause=()=>$('#pp').textContent='▶';au.onended=()=>step(1);
au.ontimeupdate=()=>{$('#fill').style.width=(au.currentTime/(au.duration||30)*100)+'%';$('#cur').textContent=mm(au.currentTime);$('#dur').textContent=mm(au.duration||30)};
$('#pp').onclick=()=>cur?(au.paused?au.play():au.pause()):view[0]&&play(view[0]);
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
$('#bar').onclick=e=>{if(au.duration)au.currentTime=e.offsetX/e.currentTarget.clientWidth*au.duration};
/* event */
$('#q').oninput=e=>{q=e.target.value.toLowerCase();lim=48;render()};
$('#sort').onchange=e=>{srt=+e.target.value;render()};
$('#more').onclick=()=>{lim+=48;render()};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(b){f=b.dataset.f;lim=48;render()}};
$('#grid').onclick=e=>{const h=e.target.closest('.hb');
 if(h){const id=+h.dataset.h;fav.has(id)?fav.delete(id):fav.add(id);try{localStorage.setItem('angga-fav',JSON.stringify([...fav]))}catch(_){}
  h.classList.toggle('on');h.textContent=fav.has(id)?'♥':'♡';chips();return}
 const c=e.target.closest('.card');if(c)play(items[+c.dataset.id])};
render();
</script>
</body>
